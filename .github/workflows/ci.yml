name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Typecheck and docs lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        # Typecheck/lint only need the dependency graph. Root prepare builds the
        # publishable package and would add ~22s without being consumed here.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Concord 0.12.0
        shell: bash
        run: |
          set -euo pipefail
          concord_root="$(mktemp -d "${RUNNER_TEMP}/concord-0.12.0.XXXXXX")"
          curl --fail --location --retry 3 \
            https://github.com/CorrectRoadH/Concord/releases/download/v0.12.0/concord-sdlc-0.12.0.tgz \
            --output "${concord_root}/concord.tgz"
          echo "9908f62911d35091e70b7307286a772f2bc05942e1c3e830d6e986e7050f7556  ${concord_root}/concord.tgz" | sha256sum --check
          tar -xzf "${concord_root}/concord.tgz" -C "$concord_root"
          pnpm --dir "${concord_root}/package" install --prod --frozen-lockfile --ignore-scripts --package-import-method=copy
          mkdir "${concord_root}/bin"
          chmod +x "${concord_root}/package/dist/entry.js"
          ln -s "${concord_root}/package/dist/entry.js" "${concord_root}/bin/concord"
          echo "${concord_root}/bin" >> "$GITHUB_PATH"
          "${concord_root}/bin/concord" --version

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint docs
        run: pnpm run lint:docs

      - name: Example tier sync check
        run: pnpm examples:sync check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm test

  docs-site:
    name: docs-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # mint CLI 要 LTS Node；这个 job 与 package job 并行，不拖住代码侧反馈。
      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Mint 不进根 devDependencies，避免所有非文档 job 都安装它的大依赖树。
      # npx 环境按精确 CLI 版本单独缓存；lint:docs-site 先预热，
      # 再并发 validate/links。
      - name: Restore Mint CLI cache
        uses: actions/cache@v6
        with:
          path: ~/.npm/_npx
          key: mint-cli-${{ runner.os }}-${{ runner.arch }}-node24-4.2.812

      - name: Lint docs-site and validate with mint
        run: pnpm run lint:docs-site
